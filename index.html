// referencial do caminho em z: centro x, direção a (yaw), cos e sen
function frameAt(z,o){ o=o||{}; const d=(pathX(z+.05)-pathX(z-.05))/.1; o.x=pathX(z); o.a=Math.atan(d); o.c=Math.cos(o.a); o.s=Math.sin(o.a); return o; }

function ribbon(lat0,lat1,z0,z1,step,us,vs){

    [lat0,lat1].forEach(l=>{ pos.push(f.x+l*f.c,0,z-l*f.s); uv.push((l-lat0)*us,arc*vs); }); }

// ---------- neblina sobrenatural ----------
// três camadas rente ao chão (fiapos que giram devagar, com contorno de tinta) + uma parede em volta que esconde o que está longe.
// Cor acompanha o fundo: papel olhando para a frente, fumaça escura no vazio; no clarão, inverte.
const FOGN=`float h1(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h1(i),h1(i+vec2(1.,0.)),f.x),mix(h1(i+vec2(0.,1.)),h1(i+vec2(1.,1.)),f.x),f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<${TOUCH?3:4};i++){ s+=a*vn(p); p=p*2.03+vec2(17.3,9.1); a*=.5; } return s; }`;
const FOG_U=()=>({uT:{value:0},uA:{value:1},uSeed:{value:0},uH:{value:0},uLine:{value:0},uCol:{value:new THREE.Color(PAPER)},uInk:{value:new THREE.Color(INK)},uP:{value:new THREE.Vector2()},uInv:INV});
let fogLayers=[], fogWall=null;
function buildFog(){
  const vs='varying vec3 vW; varying vec2 vUv; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }';
  // camadas empilhadas (0 = rente ao chão .. 1 = topo): o mesmo campo de ruído em todas, mas quanto mais alto, só os
  // tufos mais densos chegam lá e mais transparente fica -> a névoa sobe em montes, forte embaixo e sumindo para cima
  const ground=`uniform float uT,uA,uSeed,uH,uLine,uInv; uniform vec3 uCol,uInk; uniform vec2 uP; varying vec3 vW; ${FOGN}
    void main(){ vec2 p=vW.xz*.15+vec2(uH*.5,uH*.25)+vec2(0.,uT*.012*uH);
      vec2 q=vec2(fbm(p+vec2(0.,uT*.05)),fbm(p+vec2(5.2,1.3)-uT*.04));
      float n=fbm(p+2.4*q+vec2(uT*.025,0.));
      float d=length(vW.xz-uP);
      float near=smoothstep(.6,3.2,d), edge=1.-smoothstep(22.,30.,d);
      float a=smoothstep(.22+.36*uH,.55+.32*uH,n)*near*edge*uA;
      float ln=uLine*(1.-smoothstep(0.,.016,abs(n-(.4+.3*uH))))*near*edge; // contorno de tinta nos fiapos
      vec3 c=mix(uCol,uInk,ln); c=mix(c,1.-c,uInv);
      gl_FragColor=vec4(c,max(a,ln*.7)); }`;
  const NL=TOUCH?5:8, TOP=TOUCH?1.25:1.5, L=[];
  for(let i=0;i<NL;i++){ const h=i/(NL-1); L.push([.04+h*TOP,(TOUCH?.72:.6)*Math.pow(1-h*.85,1.3),i===Math.round(NL*.3)?.7:0,h]); }
  L.forEach(([y,a,line,h])=>{ const u=FOG_U(); u.uA.value=a; u.uH.value=h; u.uLine.value=line;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(64,64),new THREE.ShaderMaterial({uniforms:u,vertexShader:vs,fragmentShader:ground,transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    m.rotation.x=-Math.PI/2; m.position.y=y; m.renderOrder=.5; m.userData.y=y; scene.add(m); fogLayers.push(m); });
  // parede: anel em volta dela (raio 10), densa embaixo e rala em cima; desliza devagar
  const wall=`uniform float uT,uA,uInv; uniform vec3 uCol; varying vec2 vUv; ${FOGN}
    void main(){ vec2 p=vec2(vUv.x*38.,vUv.y*3.2);
      float n=fbm(p+vec2(uT*.06,-uT*.02)+1.7*vec2(fbm(p*.7+uT*.03),fbm(p*.7+3.1)));
      float a=smoothstep(.2,.6,n)*(1.-smoothstep(.12,.7,vUv.y))*uA;
      vec3 c=mix(uCol,1.-uCol,uInv); gl_FragColor=vec4(c,a); }`;
  const u=FOG_U(); u.uA.value=.97;
  fogWall=new THREE.Mesh(new THREE.CylinderGeometry(10,10,7,48,1,true),new THREE.ShaderMaterial({uniforms:u,vertexShader:vs,fragmentShader:wall,transparent:true,depthWrite:false,side:THREE.BackSide,fog:false}));
  fogWall.renderOrder=.4; scene.add(fogWall);
}
const FOGDARK=new THREE.Color('#202020'), FOGINKV=new THREE.Color('#9a968c'), FOGTINT=new THREE.Color('#aeb0b0');
function fogTick(wx,wz,base,vs){ // base: cor do papel do momento; vs: 0 olhando em frente .. 1 olhando o vazio
  const col=base.clone().lerp(FOGTINT,.28).lerp(FOGDARK,vs); FOGCOL.copy(base).lerp(FOGTINT,.28); const ink=new THREE.Color(INK).lerp(FOGINKV,vs);

  if(fogWall){ fogWall.position.set(wx,3.5,wz); const U=fogWall.material.uniforms; U.uT.value=t; U.uCol.value.copy(col); U.uA.value=.97*(1-.75*vs); } // no vazio a parede afina: o corpo do lobo aparece atrás dela
}

// ---------- casa da vovó e lobisomem ----------
// A casa fica na trilha, de verdade, logo atrás da última fileira de árvores (as árvores da frente a tapam).
// Flores 1-5: aparece INTEIRA, surgindo da névoa (cada flor tira 20% da transparência; opaca na 5ª), sempre lá atrás da última árvore;
// 6-9: vai chegando mais perto; 10: ela chega, o lobisomem sai da porta e a pega.
let house=null, wolfman=null, houseOn=false, houseNear=34, houseS=.45, houseD=34, houseVis=0, houseHead=0, houseT=0, FOGCOL=new THREE.Color(PAPER);
const HOUSE_W=16, HOUSE_D=[34,34,34,34,34,34,27,21,16,13], HOUSE_S=[.45,.45,.45,.45,.45,.45,.49,.53,.57,.6]; // distância e tamanho por flor (começa pequena; no fim 40% menor que a original)
function buildHouse(){
  if(!CASATEX.casa) return;
  const C=CASA.casa, H=HOUSE_W*C.h/C.w, geo=new THREE.PlaneGeometry(HOUSE_W,H); geo.translate(0,H/2,0);
  // A casa fica ATRÁS de todas as árvores, até das apagadas pela névoa: ela é MULTIPLICADA sobre o que já está desenhado.
  // O papel da casa (≈branco) não muda nada; o traço dela escurece o fundo. Assim o traço de qualquer árvore lá atrás
  // continua aparecendo por cima da casa (árvore "transparente" na frente), e as árvores perto (preenchidas) a tapam pelo depth.
  // No clarão (cores invertidas) a conta vira MAX: traço branco sobre fundo escuro. Visibilidade: 0 -> 1 = 100% -> 0% de transparência.
  const mat=new THREE.ShaderMaterial({uniforms:{map:{value:CASATEX.casa},uVis:{value:0},uInv:INV},side:THREE.DoubleSide,transparent:true,depthWrite:false,
    blending:THREE.CustomBlending, blendEquation:THREE.AddEquation, blendSrc:THREE.DstColorFactor, blendDst:THREE.ZeroFactor,
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader:`uniform sampler2D map; uniform float uVis,uInv; varying vec2 vUv;
      void main(){ vec4 tx=texture2D(map,vUv); if(tx.a<.5) discard;
        float show=uVis*mix(.35,1.,smoothstep(.0,.2,vUv.y));   // o pé some na neblina
        vec3 c=mix(vec3(1.),clamp(tx.rgb/.95,0.,1.),show);     // papel da casa = branco puro (não escurece o fundo)
        gl_FragColor=vec4(uInv>.5?1.-c:c,1.); }`});
  house=new THREE.Mesh(geo,mat); house.visible=false; scene.add(house);
  // lobisomem: filho da casa (fica na porta, na escala dela); no bote solta da casa e vem para a câmera
  if(CASATEX.lobPe && CASATEX.lobBote){
    const L=CASA.lobPe, B=CASA.lobBote, LH=H*.42;
    const mk=(k,w,h)=>{ const g=new THREE.PlaneGeometry(w,h); g.translate(0,h/2,0); return {g,m:new THREE.MeshBasicMaterial({map:CASATEX[k],alphaTest:.5,side:THREE.DoubleSide,fog:false})}; };
    const pe=mk('lobPe',LH*L.w/L.h,LH), bote=mk('lobBote',LH*1.05*B.w/B.h,LH*1.05);
    patchInvert(pe.m); patchInvert(bote.m);
    wolfman=new THREE.Mesh(pe.g,pe.m); wolfman.userData={pe,bote}; wolfman.visible=false;
    wolfman.position.set((C.porta[0]-.5)*HOUSE_W,(1-C.porta[1])*H,.05); house.add(wolfman);
  }
}
function houseTick(dt,wx,wz){
  if(!house) return;
  const final=state==='house';
  const gi=Math.min(9,got), tgtD=final?11:HOUSE_D[gi], tgtS=final?.6:HOUSE_S[gi];
  houseS+=(tgtS-houseS)*Math.min(1,dt*(final?1.4:.6));
  const tgtV=final?1:Math.min(1,got*.2);   // começa 100% transparente; cada flor tira 20% (opaca na 5ª)
  houseD+=(tgtD-houseD)*Math.min(1,dt*(final?1.4:.6)); houseVis+=(tgtV-houseVis)*Math.min(1,dt*.8);
  house.visible=houseVis>.01;
  // Ponto distante fixo no mundo: a houseD à frente dela, no rumo da trilha (depende só de onde ELA está; virar a cabeça não muda).
  // Para as árvores de verdade a taparem, a casa é posta logo atrás da última árvore que fecha o corredor nessa direção,
  // no raio câmera -> ponto distante e encolhida na mesma proporção: na tela se comporta como um objeto lá no fundo.
  frameAt(pz,FR); if(!houseOn){ houseOn=true; houseHead=FR.a; } houseHead+=(FR.a-houseHead)*Math.min(1,dt*.8); // posicionada desde o início, invisível: quando aparece já está no lugar (não entra de lado)
  const fx=wx-Math.sin(houseHead)*houseD, fzz=wz-Math.cos(houseHead)*houseD, fy=final?-1.2:-.3;
  let dist=houseD;
  if(!final){ const tn=Math.tan(houseHead), ff={}; let hit=Infinity;
    for(const r of rows){ const tt=wz-r.z; if(tt<1.5||tt>=hit) continue;
      frameAt(r.z,ff); const lat=(wx-tn*tt-ff.x)*ff.c;
      if(Math.abs(lat)>.6 || r.block.some(b=>lat>b[0]-.4&&lat<b[1]+.4)) hit=tt; } // galhos das árvores da beira entram no corredor
    houseNear+=(clamp(hit+1.3,6,houseD)-houseNear)*Math.min(1,dt*2); dist=Math.min(houseD,houseNear); }
  const cp=cam.position, dx=fx-cp.x, dy=fy-cp.y, dz=fzz-cp.z, full=Math.hypot(dx,dz), k=Math.min(1,dist/full);
  house.position.set(cp.x+dx*k,cp.y+dy*k,cp.z+dz*k);
  house.rotation.set(0,houseHead,0);
  house.scale.setScalar(houseS*k);
  house.material.uniforms.uVis.value=houseVis;
  { const m=house.material, inv=INV.value>.5; // normal: multiplica (traço escurece); clarão: max (traço claro sobre o escuro)
    m.blendEquation=inv?THREE.MaxEquation:THREE.AddEquation; m.blendSrc=inv?THREE.OneFactor:THREE.DstColorFactor; m.blendDst=inv?THREE.OneFactor:THREE.ZeroFactor; }
}
function startHouse(){ // 10 flores: chegou na casa
  if(state!=='play') return; state='house'; houseT=0; musicOn=false; keys.fwd=keys.left=keys.right=false; stickEnd();
}
function houseFinal(dt){ // ela anda até a casa, o lobisomem aparece na porta, sai correndo e a pega
  houseT+=dt; yaw*=Math.pow(.02,dt); lookAmt=Math.max(0,lookAmt-dt*2); progress=Math.max(0,progress-dt*.3);
  if(houseT<2.6) pz-=1.4*dt*(1-houseT/2.6);
  const clearD=lerp(40,1.2,Math.min(1,houseT/2.2)); rows.forEach(r=>{ r.g.visible=(pz-r.z)<clearD; }); // a mata se abre numa clareira diante da casa
  if(!wolfman) { if(houseT>3) over(); return; }

  if(houseT>3.6 && W.parent===house){ // bote: solta da casa mantendo onde está na tela

    house.remove(W); scene.add(W); W.position.copy(p); W.scale.copy(sc); W.geometry=U.bote.g; W.material=U.bote.m;
    W.material.depthTest=false; W.material.transparent=true; W.material.depthWrite=false; W.renderOrder=10; U.p0=p.clone(); U.s0=sc.x; U.t0=houseT; if(AC) sfx.roar(); shake=.5; // passa por cima de tudo, até da neblina

    const sc=lerp(U.s0,.75,q), hb=W.geometry.parameters.height; W.position.lerpVectors(U.p0,tgt,q); W.position.y=lerp(U.p0.y,cam.position.y-.74*hb*.75,q); W.scale.setScalar(sc); shake=Math.max(shake,.25*q); // a cara vem para a altura dos olhos

  }

}

// uma fileira = um grupo virado para a trilha naquele ponto; recicla para frente quando fica para trás
function placeRow(row,k){
  row.k=k; const z=rowZ(k); row.z=z; const p=rowParams(k), r=RNG(p.seed), g=row.g;
  while(g.children.length) g.remove(g.children[0]); row.sway.length=0; row.faces.length=0; row.block=[];
  placeOnPath(g,z,0);
  const f=clamp(-z/TOTAL,0,1);
  const add=(t,amp)=>{ g.add(t); row.sway.push({o:t,b:0,a:amp,ph:r()*6.28,f:.5+r()*.4}); };
  [-1,1].forEach(side=>{
    const inn=side<0?p.inL:p.inR;
    // árvore da beira: galhos esticados por cima da trilha (é dela que a garra sai)
    const pine=r()<.2-f*.14 && !CLAWROWS.has(k+':'+side);
    if(pine){ const t=pineTree(r,4.2+r()*1.8); t.position.x=side*(inn+.3); add(t,.012); }
    else { const t=deadTree(r,3.9+r()*1.6,-side,2+Math.floor(r()*3),row.sway,.5,row.faces,1); t.position.x=side*inn; add(t,.006); }
    // espinheiro e raiz na beira da faixa andável
    const nG=r()<.75?1:(r()<.6?2:0);
    for(let i=0;i<nG;i++){ const gp=groundPiece(r,r()<.6?'arbusto':'raiz',.5+r()*.4); gp.position.set(side*(PXMAX+.35+r()*.5),0,.2+r()*.6); g.add(gp); }
    // árvores do fundo
    const nB=1+Math.floor(r()*3);
    for(let i=0;i<nB;i++){
      const lat=side*(inn+1.2+r()*7.5), zz=(r()-.5)*1.1;
      let t;
      if(r()<.45-f*.25){ t=pineTree(r,4.5+r()*3); add(t,.01+r()*.01); }
      else { t=deadTree(r,4.6+r()*3,0,1+Math.floor(r()*3),row.sway,0,row.faces,1); add(t,.005); }
      t.position.set(lat,0,zz);
    }
  });
  // capim e mato espalhados pelo caminho (não bloqueiam)
  const nC=3+Math.floor(r()*4), cat=PECAS.capim?'capim':'arbusto';
  for(let i=0;i<nC;i++){ const gp=groundPiece(r,cat,(cat==='capim'?.28:.22)+r()*.3); gp.position.set((r()-.5)*2*(PXMAX+.4),0,(r()-.5)*1.4); g.add(gp); }
  // moita no meio do caminho: bloqueia; ela contorna por um lado ou pelo outro (sempre sobra passagem)
  const nearClaw=[k-1,k,k+1].some(q=>CLAWROWS.has(q+':-1')||CLAWROWS.has(q+':1'));
  if(k>4 && !nearClaw && r()<.62){
    if(r()<.4+f*.25){ // árvore plantada no caminho: desvia por um lado ou pelo outro
      const c=(r()<.5?-1:1)*(.25+r()*.75), t=deadTree(r,3.8+r()*1.4,0,1+Math.floor(r()*3),row.sway,.55,row.faces,1);
      t.position.set(c,0,0); add(t,.005); const hw=t.userData.w0*.42; row.block.push([c-hw,c+hw]);
      const gp=groundPiece(r,r()<.5?'raiz':'arbusto',.35+r()*.25); gp.position.set(c+(r()-.5)*.6,0,.15); g.add(gp);
    } else {
    const w=.7+r()*.6, c=(r()-.5)*2*(PXMAX-.3), lo=c-w/2, hi=c+w/2;
    if(lo+PXMAX>.75 || PXMAX-hi>.75){
      const bp=pick(PECAS.arbusto,r), m=new THREE.Mesh(bp.geo,bp.mat), H=clamp(w*1.15/bp.asp,.55,1.05);
      m.scale.set(H*(r()<.5?-1:1),H,1); m.position.set(c,-.03,0); g.add(m);
      if(PECAS.capim){ const a=groundPiece(r,'capim',.3+r()*.2); a.position.set(lo+.05,0,.12); g.add(a); }
      row.block.push([lo+.08,hi-.08]);
    }
    }
  }
}

// celular: dedo na tela vira manche (invisível). Para cima anda, sempre na mesma velocidade; para o lado anda na diagonal

let stick=null, touchLat=0, touchYaw=null;

function stickApply(){
  const R=Math.min(innerWidth,innerHeight)*.2, dx=stick.x-stick.x0, dy=stick.y-stick.y0;
  const nx=clamp(dx/R,-1,1), ny=clamp(-dy/R,-1,1), mag=Math.hypot(nx,ny);
  keys.fwd=mag>.18 && ny>-.35; keys.run=false; // no toque só caminha (sem correr)
  touchLat=Math.abs(nx)<.12?0:clamp(nx*1.5,-1,1);

}

  stickApply(); e.preventDefault(); },{passive:false});

addEventListener('pointerup',e=>{ if(stick&&e.pointerId===stick.id) stickEnd(); });
addEventListener('pointercancel',e=>{ if(stick&&e.pointerId===stick.id) stickEnd(); });

const BLOOD='#7d0818';
function bloodRun(mode,done){
  const cv=$('bloodfx'), g=cv.getContext('2d'), W=innerWidth, H=innerHeight, r=Math.random;
  cv.width=W; cv.height=H; cv.classList.remove('hide');
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#8e0a1c'); gr.addColorStop(1,'#5c0410');
  // borda do sangue: curva irregular e suave (nós aleatórios a cada ~70px)
  const KN=Math.ceil(W/70)+2, kn=[]; for(let i=0;i<KN;i++) kn.push(r());
  const off=x=>{ const f=x/70, i=Math.floor(f), u=f-i, e=(1-Math.cos(u*Math.PI))/2; return lerp(kn[i]||0,kn[i+1]||0,e); };
  const AMP=H*.14, drips=[], nd=Math.round(W/(mode==='cover'?34:30));
  for(let i=0;i<nd;i++){ const big=r()<.25; drips.push({x:r()*W, w:big?9+r()*9:2.5+r()*6, v:(mode==='cover'?30:25)+r()*r()*(mode==='cover'?240:160), a:r()*r()*(mode==='cover'?160:60), d:mode==='cover'?0:r()*H*.6, hl:r()<.3}); }
  let last=performance.now(), T=0;
  const edge=(x,base)=>base+off(x)*AMP;
  (function step(now){ const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt; if(mode==='drain') cv.style.background='none';
    g.clearRect(0,0,W,H); g.fillStyle=gr;
    if(mode==='cover'){ // cortina que desce do alto, com gotas compridas correndo na frente
      const k=Math.min(1,T/2.8), base=-AMP+(H+AMP*1.2)*Math.pow(k,1.7);
      g.beginPath(); g.moveTo(0,0); for(let x=0;x<=W+8;x+=8) g.lineTo(x,edge(x,base)+Math.sin(x*.05+T*3)*3); g.lineTo(W,0); g.closePath(); g.fill();
      for(const d of drips){ d.v+=d.a*dt; d.d+=d.v*dt; const y0=edge(d.x,base), y=y0+d.d;
        g.fillRect(d.x-d.w/2,0,d.w,y); g.beginPath(); g.arc(d.x,y,d.w*.75,0,6.283); g.fill();
        if(d.hl){ g.fillStyle='rgba(255,180,180,.18)'; g.fillRect(d.x-d.w*.25,y0,Math.max(1,d.w*.15),d.d-d.w); g.fillStyle=gr; } }
      if(k>=1){ g.fillRect(0,0,W,H); if(done) done(); return; }
    } else { // o sangue escorre para baixo e revela o menu, deixando rastros finos que descem mais devagar
      const k=Math.min(1,T/2.4), base=-AMP*1.2+(H+AMP*1.4)*Math.pow(k,1.5);
      g.beginPath(); g.moveTo(0,H); for(let x=0;x<=W+8;x+=8) g.lineTo(x,edge(x,base)); g.lineTo(W,H); g.closePath(); g.fill();
      let vivos=0;
      for(const d of drips){ const yb=edge(d.x,base); if(!d.on){ if(yb>d.d+20) d.on=true; else { vivos++; continue; } }
        d.d+=d.v*dt; if(d.d>=yb) continue; vivos++; // rastro: fica grudado depois que a cortina passa e desce devagar
        g.fillRect(d.x-d.w/2,d.d,d.w,yb-d.d+2); g.beginPath(); g.arc(d.x,d.d,d.w*.6,0,6.283); g.fill();
        if(d.hl){ g.fillStyle='rgba(255,180,180,.15)'; g.fillRect(d.x-d.w*.25,d.d+d.w,Math.max(1,d.w*.15),yb-d.d); g.fillStyle=gr; } }
      if(k>=1 && !vivos){ cv.classList.add('hide'); return; }
    }
    requestAnimationFrame(step); })(last);
}

const rainCv=document.getElementById('rain'), rg=rainCv.getContext('2d'); let RW=1,RH=1,RD=1,lastY=null;
function rainSize(){ RD=Math.min(devicePixelRatio,TOUCH?1.25:2); RW=rainCv.width=Math.round(innerWidth*RD); RH=rainCv.height=Math.round(innerHeight*RD); }
rainSize(); addEventListener('resize',rainSize);
const drops=[], splashes=[]; for(let i=0;i<(TOUCH?150:230);i++) drops.push({x:Math.random(),y:Math.random(),z:Math.random()}); // z: 0 longe .. 1 perto
function rainTick(dt,Ycur,flash){
  let dy=lastY===null?0:Ycur-lastY; lastY=Ycur; if(Math.abs(dy)>.5) dy=0;
  rg.clearRect(0,0,RW,RH); rg.lineCap='round'; rg.strokeStyle=flash?PAPER:INK;
  const sl=.3;
  for(const d of drops){
    const sp=1.0+d.z*1.5; // telas por segundo
    d.y+=sp*dt; d.x+=-sl*sp*dt*RH/RW+dy*(.3+.7*d.z)/1.87; // vira a cabeça: a chuva perto corre mais (paralaxe)
    if(d.y>1.05){ d.y=-.1; d.x=Math.random(); if(d.z>.5&&splashes.length<40) splashes.push({x:Math.random(),y:.66+Math.random()*.34,t:0}); }
    d.x=(d.x%1+1)%1;
    const L=(.03+.06*d.z)*RH, x=d.x*RW, y=d.y*RH;
    rg.globalAlpha=.3+.55*d.z; rg.lineWidth=(1+2.4*d.z)*RD;
    rg.beginPath(); rg.moveTo(x+sl*L,y-L); rg.lineTo(x,y); rg.stroke();
  }
  rg.lineWidth=2*RD; rg.globalAlpha=.7;
  for(let i=splashes.length-1;i>=0;i--){ const p=splashes[i]; p.t+=dt; if(p.t>.2){ splashes.splice(i,1); continue; }
    const k=p.t/.2, x=p.x*RW, y=p.y*RH, w=(4+10*k)*RD, h=(3+6*(1-k))*RD;
    rg.beginPath(); rg.moveTo(x-w,y-h); rg.lineTo(x-w*.3,y); rg.moveTo(x+w,y-h); rg.lineTo(x+w*.3,y); rg.stroke(); }
  rg.globalAlpha=1;
}

  const n=3+Math.floor(Math.random()*4), f={};
  for(let i=0;i<n;i++){ const m=blood[bloodI++%blood.length], z=pz-1-Math.random()*5, lat=(Math.random()-.5)*2.2; frameAt(z,f);
    m.position.set(f.x+lat*f.c,.02+(bloodI%10)*.001,z-lat*f.s); m.rotation.y=Math.random()*6.28; m.scale.setScalar(.7+Math.random()*.7); m.visible=false; BLOODSET.push(m); }
}
// cada relâmpago acorda rostos em 3 a 5 árvores à vista (sempre outras)
function setFace(m,on){ if(m.userData.faceMat) m.material=on?m.userData.faceMat:m.userData.cleanMat; else m.visible=on; }
function pickFaces(){
  FACESET.forEach(m=>setFace(m,false)); FACESET=[]; const v=new THREE.Vector3(), c=[];
  rows.forEach(rw=>rw.faces.forEach(m=>{ v.set(0,.5,0); m.localToWorld(v); const d=v.distanceTo(cam.position); if(d<2.5||d>18) return; // meio do tronco
    v.project(cam); if(v.z<1 && Math.abs(v.x)<.92 && Math.abs(v.y)<.8) c.push({m,d,f:m.userData.front,sx:v.x}); }));

  const fr=c.filter(o=>o.f).sort((a,b)=>a.d-b.d).slice(0,5), bk=c.filter(o=>!o.f);
  for(let n=2+Math.floor(Math.random()*2); n>0 && fr.length; n--) FACESET.push(fr.splice(Math.floor(Math.random()*Math.min(3,fr.length)),1)[0].m);
  for(let n=1+Math.floor(Math.random()*2); n>0 && bk.length; n--) FACESET.push(bk.splice(Math.floor(Math.random()*bk.length),1)[0].m);

  // quanto mais longe na floresta, mais enforcados nas árvores ao redor (1 no começo, até 6 no fim)
  const fz=clamp(-pz/TOTAL,0,1), far=[];
  rows.forEach(rw=>rw.faces.forEach(m=>{ if(FACESET.includes(m)) return; v.set(0,.5,0); m.localToWorld(v); const d=v.distanceTo(cam.position); if(d<7||d>28) return;
    v.project(cam); if(v.z<1 && Math.abs(v.x)<.95 && Math.abs(v.y)<1) far.push({m,d}); }));

  for(let i=0;i<nH && far.length;i++){
    const o=far.splice(Math.floor(Math.random()*far.length),1)[0], tg=o.m.parent, h=hanged[i], H=tg.userData.H||5;

function lightning(){
  pickFaces();
  // como um relâmpago real/filmado: pré-golpe curto, pausa, golpe principal que acende seco e sai desbotando.
  // Só 2 clarões em menos de 1 s (limite de fotossensibilidade: até 3 por segundo).
  // 1 ou 2 piscadas curtas, depois fica aceso ~meio segundo e desbota. No máximo 3 clarões no segundo (limite de fotossensibilidade).
  const seg=[], np=REDUCE?0:(Math.random()<.5?1:2);
  for(let i=0;i<np;i++) seg.push([1,.045+Math.random()*.03],[0,.07+Math.random()*.05]);
  const fz=clamp(-pz/TOTAL,0,1); // quanto mais longe na floresta, mais o clarão demora a apagar
  seg.push([1,(.45+Math.random()*.15)*(1+2*fz)]);

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(state!=='paused' && state!=='loading') update(dt);
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
function update(dt){

      for(const b of rw.block){ const over=px+.2>b[0] && px-.2<b[1];
        if(over && pz>=rw.z+.28 && nz<rw.z+.28){ nz=rw.z+.28; if(speed>0){ px=clamp(px+(px<(b[0]+b[1])/2?-1:1)*.9*dt,-PXMAX,PXMAX); if(Math.random()<dt*3) sfx.rustle(); } }
        else if(over && pz<rw.z+.28 && pz>rw.z-.28){ px=px<(b[0]+b[1])/2?b[0]-.2:b[1]+.2; } } }

      // acerta se o braço alcança o lado dela E, nesse ponto, já desceu até a altura do corpo
      if(c.state==='out'&&s>.45&&state==='play'&&inv<=0&&Math.abs(pz-c.z)<.55){
        const dist=c.side<0?(px-.18)+c.anchor:c.anchor-(px+.18);
        const reach=Math.cos(th)*c.len*s, yAt=CLAW_Y+Math.tan(th)*Math.max(0,dist);
        if(dist<reach && yAt<1.35 && yAt>-.1){ hit(); c.state='in'; c.t=0; }
      }
    }
  });
  // flores
  flowers.forEach(f=>{
    f.m.rotation.y=Y;
    if(f.got){ if(f.fly<1){ f.fly+=dt*2.5; f.m.position.lerp(new THREE.Vector3(wx,.8,wz),Math.min(1,f.fly)); f.m.scale.setScalar(Math.max(.01,1-f.fly)); if(f.fly>=1) f.m.visible=false; } return; }
    const looking=f.side<0?yaw>.5:yaw<-.5;
    if(state==='play' && Math.abs(pz-f.z)<.9 && px*f.side>.45 && looking){ f.got=true; got++; $('fl').textContent=got; sfx.chime(); if(got>=10) startHouse(); }
  });
  // olhos
  const dist=state==='caught'?lerp(3,.9,Math.min(1,caughtT/1.2)):70-progress*67;
  blinkT-=dt; if(blinkT<0){ blink=.16; blinkT=2.5+Math.random()*4; } blink=Math.max(0,blink-dt);
  const op=state==='caught'?1:Math.pow(lookAmt,.7);
  if(wolf){ // lobo: chega de forma contínua, tamanho fixo no mundo; só a distância encurta (cresce hiperbólico)
    if(state==='play'){
      wShow+=(progress-wShow)*Math.min(1,dt*4); // aproximação contínua e suave (sem botes)
      if(wShow>.35 && !wGrowl){ wGrowl=true; if(AC) sfx.growl(eyeSide*.7); }
    } else if(state==='caught'){ wShow=1; }
    const sm=(a,b,x)=>{ const u=clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
    const wd=state==='caught'?lerp(WOLF_MIN,2.4,Math.pow(Math.min(1,caughtT/1.1),2)):WOLF_MIN+(70-WOLF_MIN)*Math.pow(1-wShow,1.5);
    const lu=0;
    const bRev=state==='caught'?1:sm(.5,.95,wShow); // corpo aparece depois dos dentes; a cabeça sobe para caber o corpo embaixo
    const S=8.5*(1-.18*bRev)*(1+.018*Math.sin(t*2.3)+.04*lu), sway=Math.sin(t*.5)*.6*(1-wShow*.6), el=eyeSide*wd+sway*0;
    const eBase=2.5+.5*wShow*wShow+5.2*bRev, ce=Math.min(1,caughtT/1.1);
    const ey=(state==='caught'?lerp(8.2,1.6,ce*ce):eBase+Math.sin(t*2.3)*.05-.35*lu)-(LOBO.ey-.5)*S;
    const U=wolfMat.uniforms; U.uOp.value=op; U.uR2.value=state==='caught'?1:sm(.38,.62,wShow); U.uR3.value=state==='caught'?1:sm(.72,.97,wShow);
    U.uT.value=t; U.uBlink.value=blink>0?1:0; U.uGlow.value=.7+.3*Math.sin(t*3.1);
    wolf.visible=op>.01; wolf.scale.set(S,S,1);
    const fx=-FR.s, fz=-FR.c, lat=(LOBO.ex-.5)*S; // à frente na trilha + de lado; balança devagar para passar atrás dos troncos
    wolf.position.set(wx+FR.c*(el-lat)+fx*(.3+sway), ey, wz-FR.s*(el-lat)+fz*(.3+sway)); wolf.lookAt(cam.position);
    wolf.rotateZ(Math.sin(t*.9)*.03-lu*.04*eyeSide);
    const fr=state==='caught'?sm(.2,.7,caughtT):0; U.uMul.value=1-fr; wolfFrontMat.uniforms.uMul.value=fr; // sempre por entre as árvores; só no bote final passa por cima
    if(wolfBody){ const top=wolf.position.y-.28*S, feet=-1.2, BH=Math.max(.1,top-feet), BW=BH*LOBOCORPO.w/LOBOCORPO.h;
      wolfBody.visible=wolf.visible&&bRev>.01&&state!=='caught'; wolfBody.scale.set(BW,BH,1); wolfBody.position.set(wolf.position.x,(top+feet)/2,wolf.position.z); wolfBody.quaternion.copy(wolf.quaternion);
      const B=wolfBody.material.uniforms; B.uRev.value=bRev; B.uOp.value=op; B.uT.value=t; }
    wolfFront.visible=wolf.visible&&fr>.01; wolfFront.position.copy(wolf.position); wolfFront.quaternion.copy(wolf.quaternion); wolfFront.scale.copy(wolf.scale);
  }
  eyesMat.opacity=wolf?0:op; eyes.visible=!wolf&&op>.01;
  const el=eyeSide*dist; // de lado em relação à trilha, um pouco à frente
  eyes.position.set(wx+FR.c*el-FR.s*.3, (state==='caught'?1.4:2.6)+Math.sin(t*.7)*.25, wz-FR.s*el-FR.c*.3);
  eyes.scale.set(1,blink>0?.12:1,1);
  eyes.lookAt(cam.position);
  // papel escurecendo no fim
  const fz=clamp(-pz/TOTAL,0,1), pc=new THREE.Color(PAPER).lerp(new THREE.Color('#b9b4a8'),fz*fz);
  scene.fog.color.copy(pc);
  if(sky){ sky.position.set(wx,42,wz); sky.rotation.y=heading; sky.material.opacity=1-(state==='caught'?1:lookAmt*lookAmt*(3-2*lookAmt)); }
  // vazio: o fundo vai do papel ao preto conforme ela vira a cabeça (sem borda dura); no clarão, inverte
  const vz=state==='caught'?1:lookAmt, vs=vz*vz*(3-2*vz);
  scene.background.copy(pc).lerp(BLACK,vs); fogTick(wx,wz,pc,vs); houseTick(dt,wx,wz); if(flashK>0){ const B=scene.background; B.setRGB(lerp(B.r,1-B.r,flashK),lerp(B.g,1-B.g,flashK),lerp(B.b,1-B.b,flashK)); }
  // traço tremendo
  boilT+=dt; if(boilT>.2){ boilT=0; boilF=(boilF+1)%3; boilers.forEach(b=>b.mat.map=b.frames[boilF]); lastRed=''; }
  // Chapeuzinho
  const dir=yaw>.5?-1:(yaw<-.5?1:0);
  const reach=hp===1&&!arms.length?(Math.sin(gaitT)>0?1:0):0, key=dir+'|'+hp+'|'+boilF+'|'+reach;
  if(key!==lastRed){ lastRed=key; drawRed(dir,hp,boilF*11+3,2.2,reach); }
  crawlK+=((hp<=1&&state!=='house'?1:0)-crawlK)*Math.min(1,dt*3);
  let bob=speed>0?Math.abs(Math.sin(t*speed*3.4))*.03:0, tilt=0;
  if(hp===2&&keys.fwd&&state==='play'){ const sn=Math.sin(gaitT); bob=.05*sn; tilt=.065*sn-.02; } // mancando: sobe na perna boa, afunda na ferida, sempre no mesmo ritmo
  if(hp<=1){ const mv=keys.fwd&&state==='play'; bob=mv?.012*Math.sin(gaitT*2):0; tilt=mv?.03*Math.sin(gaitT):0; }
  armsTick(hp<=1&&state!=='house'); if(pool) poolTick(dt,wx,wz);
  const jit=inv>0?Math.sin(t*50)*.03:0;
  red.position.set(wx+jit*FR.c,.65+bob-.06*crawlK,wz-jit*FR.s); red.rotation.z=tilt;
  red.rotation.y=Y; red.visible=state==='torn'||!(inv>0&&Math.floor(t*12)%2===0); // morta: não pisca, fica parada
  // câmera
  const rad=CAMR*(1-.35*lookAmt), sx=(Math.random()-.5)*shake*.3, sy=(Math.random()-.5)*shake*.3;
  deadK+=((state==='torn'?1:0)-deadK)*Math.min(1,dt*1.5); // morta pela garra: a câmera sobe um pouco e olha para baixo, para a poça
  cam.position.set(wx+Math.sin(Y)*rad*(1+.3*deadK)+sx, 1.5-.25*crawlK+.35*deadK+bob*.6+sy, wz+Math.cos(Y)*rad*(1+.3*deadK)); // arrastando: câmera mais baixa
  cam.lookAt(wx-Math.sin(Y)*lerp(6,2.2,deadK), 1.0-.75*crawlK-.2*deadK, wz-Math.cos(Y)*lerp(6,2.2,deadK));
  // papel do fundo fica à frente da trilha (não do olhar): olhando de lado, aparece o vazio
  hanged.forEach((h,i)=>h.rotation.z=Math.sin(t*1.1+i*2)*.06);
  rainTick(dt,Y,flashK>.5);
  // áudio
  if(AC && AC.state==='running'){
    const n=AC.currentTime;
    musicTick();
    A.forest.frequency.setTargetAtTime(9000-lookAmt*8200,n,.08);
    A.drone.gain.setTargetAtTime(lookAmt*(.05+.25*progress)+(state==='caught'?.4:0),n,.15);
    const br=progress>.04?(.02+.4*progress)*(.3+.7*lookAmt):0;
    A.breath.gain.setTargetAtTime(br*Math.pow(Math.max(0,Math.sin(t*1.45)),2),n,.05);
    A.wind.gain.setTargetAtTime(.025+.045*wind,n,.3);
    if(A.growl){ const on=state==='play'&&wolfNear; A.growl.gain.setTargetAtTime(on?(.085+.1*progress)*(.6+.4*Math.pow(Math.sin(t*1.1),2)):0,n,on?.4:.25);
      A.growlO.frequency.setTargetAtTime(47+5*Math.sin(t*2.3)+3*Math.sin(t*5.1),n,.1); A.growlL.frequency.setTargetAtTime(9+3*Math.sin(t*.9),n,.2); }
    if(Math.random()<dt*7) burst({dur:.02,type:'bandpass',f:2200+Math.random()*3000,q:4,gain:.03+Math.random()*.05,pan:Math.random()*2-1}); // pingos
  }
}
// braços se arrastando: estica à frente, crava a mão e puxa (a mão fica no chão enquanto o corpo avança); os dois alternam
const SH_X=.19, SH_Y=-.18; // ombros (coordenadas da folha da Chapeuzinho: .95 x 1.3, centro no meio)
function armsTick(on){
  for(const m of arms){ m.visible=on; if(!on) continue;
    const {E,P,side}=m.userData, u=(((gaitT/6.2832)+(side>0?0:.5))%1+1)%1;
    let pose=E, dy, rot;
    if(u<.22){ const e=u/.22; dy=lerp(-.05,.06,e*e*(3-2*e)); rot=lerp(.2,.45,e); }          // estica para frente (rápido)
    else if(u<.5){ const e=(u-.22)/.28; dy=lerp(.06,-.04,e); rot=lerp(.45,.36,e); }          // mão cravada: o corpo passa por ela
    else { const e=(u-.5)/.5; pose=P; dy=lerp(.05,-.06,e); rot=lerp(.25,0,e); }             // braço dobrado puxando (sempre um estica enquanto o outro puxa)
    if(m.geometry!==pose.geo){ m.geometry=pose.geo; m.material=pose.mat; }
    // as duas artes vêm do lado trocado: espelha e gira o dobro da inclinação do braço para manter a direção
    // (esticado ~.49 rad -> gira .98; dobrado: girado até a mão apontar para a frente, para cima na tela)
    if(pose===E){ m.scale.x=-side; m.rotation.z=-side*(.98-rot); } else { m.scale.x=-side; m.rotation.z=side*(rot*.8-2.45); }
    const P_=pose===P; m.position.set(side*(SH_X+(P_?.04:0)), SH_Y+dy, -.004); // atrás do corpo: ombro some sob o capuz
  }
}

// ---------- início ----------
setTimeout(()=>{
  buildArt(); drawRed(0,3,1,2.2);
  loadPecas().then(()=>{
    buildWorld();
    scene.traverse(o=>{ if(o.material && !o.material.isShaderMaterial) patchInvert(o.material); });
    Object.values(PECAS).forEach(l=>l.forEach(p=>{ patchInvert(p.mat); if(p.matRosto) patchInvert(p.matRosto); })); patchInvert(hangMat);
    state='ready'; update(0); state='loading';
    $('go').disabled=false; $('go').textContent=TR('enter');
    requestAnimationFrame(frame);
  }).catch(e=>{ console.error(e); $('go').textContent=TR('noart'); });
},50);
</script>
