<script>
'use strict';
// ---------- util ----------
const PAPER='#f4f1ea', INK='#141414', RED='#c8102e';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function RNG(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
const J=(pts,a,r)=>pts.map(p=>[p[0]+(r()-.5)*2*a, p[1]+(r()-.5)*2*a]);
const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
function smoothPath(c,pts,closed){
  const n=pts.length; c.beginPath();
  if(closed){ const m0=mid(pts[n-1],pts[0]); c.moveTo(m0[0],m0[1]);
    for(let i=0;i<n;i++){ const p=pts[i], m=mid(p,pts[(i+1)%n]); c.quadraticCurveTo(p[0],p[1],m[0],m[1]); } c.closePath();
  } else { c.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<n-1;i++){ const m=mid(pts[i],pts[i+1]); c.quadraticCurveTo(pts[i][0],pts[i][1],m[0],m[1]); }
    c.lineTo(pts[n-1][0],pts[n-1][1]); }
}
function polyPath(c,pts,closed){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); if(closed) c.closePath(); }
function shape(c,pts,closed,fill,lw,straight){
  (straight?polyPath:smoothPath)(c,pts,closed);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(lw){ c.lineWidth=lw; c.strokeStyle=INK; c.stroke(); }
}
function line(c,pts,lw){ smoothPath(c,pts,false); c.lineWidth=lw; c.strokeStyle=INK; c.stroke(); }
function limb(c,pts,w0,w1,col,out){ // traço contornado e afinando
  out=out||9;
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<pts.length-1;i++){
      const w=lerp(w0,w1,i/(pts.length-1));
      c.beginPath(); c.moveTo(pts[i][0],pts[i][1]); c.lineTo(pts[i+1][0],pts[i+1][1]);
      c.lineWidth = pass?w:w+out*2; c.strokeStyle = pass?col:INK; c.stroke();
    }
  }
}
function ellipsePts(cx,cy,rx,ry,n){ const a=[]; for(let i=0;i<n;i++){ const t=i/n*Math.PI*2; a.push([cx+Math.cos(t)*rx, cy+Math.sin(t)*ry]); } return a; }
function prep(c){ c.lineJoin='round'; c.lineCap='round'; }

// ---------- three ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
const TOUCH=matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
if(TOUCH) document.body.classList.add('touch');
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.25:2)); // celular: resolução mais leve
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
scene.fog=new THREE.Fog(PAPER,12,52);
const cam=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.05,200);
// tela em pé: abre o campo de visão vertical para a largura não ficar estreita demais
let CAMR=1.05; // distância da câmera atrás dela
function fitCam(){ renderer.setSize(innerWidth,innerHeight); const a=innerWidth/innerHeight; cam.aspect=a;
  if(a<1){ cam.fov=80; CAMR=.75; } // em pé: câmera mais perto, só a parte de cima dela
  else { cam.fov=a<1.2?Math.min(100,2*Math.atan(Math.tan(33*Math.PI/180)*1.2/a)*180/Math.PI):66; CAMR=1.05; }
  cam.updateProjectionMatrix(); }
fitCam(); addEventListener('resize',fitCam);
const ANISO=renderer.capabilities.getMaxAnisotropy();
function tex(c){ const t=new THREE.CanvasTexture(c); t.anisotropy=ANISO; return t; }
const boilers=[]; // {mat, frames}
// trovão: inverte as cores dentro do shader (papel vira preto, traço vira branco); o vermelho continua vermelho
const INV={value:0};
function patchInvert(m){ if(!m||m.userData.inv) return; m.userData.inv=1;
  m.onBeforeCompile=sh=>{ sh.uniforms.uInv=INV; sh.fragmentShader='uniform float uInv;\n'+sh.fragmentShader.replace('#include <fog_fragment>',
    '#include <fog_fragment>\n if(uInv>0.){ vec3 c=gl_FragColor.rgb; float sat=max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b)); gl_FragColor.rgb=mix(c,mix(1.0-c,c,smoothstep(.25,.45,sat)),uInv); }'); }; }
function boilMat(frames,opts){ const m=new THREE.MeshBasicMaterial(Object.assign({map:frames[0],alphaTest:.5,side:THREE.DoubleSide},opts||{})); boilers.push({mat:m,frames}); return m; }

// ---------- arte do Flow: peças recortadas (demo/arte.js, gerado por arte/cortar_pecas.py) ----------
const LW=9;
let arms=[], WOLFTEX=null, SKYTEX=null; const CAPAIMG={}; // capa de costas e braços (demo/capa.js)
const PECAS={}; // categoria -> peças {w,h,px,py,asp,geo,mat,...}
function loadPecas(){
  if(!window.ARTE) return Promise.reject(new Error('arte.js não carregou'));
  const lobo=window.LOBO?new Promise(ok=>{ const im=new Image(); im.onload=()=>{ WOLFTEX=new THREE.Texture(im); WOLFTEX.needsUpdate=true; ok(); }; im.onerror=()=>ok(); im.src=LOBO.src; }):Promise.resolve();
  const ceu=window.CEU?new Promise(ok=>{ const im=new Image(); im.onload=()=>{ SKYTEX=new THREE.Texture(im); SKYTEX.wrapS=THREE.RepeatWrapping; SKYTEX.repeat.x=-1; SKYTEX.offset.x=1; SKYTEX.anisotropy=ANISO; SKYTEX.needsUpdate=true; ok(); }; im.onerror=()=>ok(); im.src=CEU.src; }):Promise.resolve();
  const capa=window.CAPA?Promise.all(Object.keys(CAPA).map(k=>new Promise(ok=>{ const im=new Image(); im.onload=()=>{ CAPAIMG[k]=im; ok(); }; im.onerror=()=>ok(); im.src=CAPA[k].src; }))):Promise.resolve();
  return Promise.all([lobo,ceu,capa].concat(ARTE.map(p=>new Promise((ok,fail)=>{ const im=new Image(); im.onload=()=>{ if(!p.srcRosto) return ok([p,im]); const i2=new Image(); i2.onload=()=>ok([p,im,i2]); i2.onerror=fail; i2.src=p.srcRosto; }; im.onerror=fail; im.src=p.src; })))).then(list=>{ list.splice(0,3);
    list.forEach(([p,im,im2])=>{
      let src=im;
      if(p.cat==='garra'){ // garra invertida (miolo preto, traço claro): salta da floresta branca
        src=mkCanvas(im.width,im.height); const g=src.getContext('2d'); g.drawImage(im,0,0);
        const d=g.getImageData(0,0,src.width,src.height), a=d.data;
        for(let i=0;i<a.length;i+=4){ const v=a[i]; a[i]=a[i+1]=a[i+2]=v>128?16:235; }
        g.putImageData(d,0,0);
      }
      const t=new THREE.Texture(src); t.anisotropy=ANISO; t.needsUpdate=true;
      const asp=p.w/p.h, geo=new THREE.PlaneGeometry(asp,1);
      geo.translate(-(p.px-p.w/2)/p.h, -(p.h/2-p.py)/p.h, 0); // origem no ponto de encaixe
      const mat=new THREE.MeshBasicMaterial({map:t,alphaTest:.5,side:THREE.DoubleSide});
      let matRosto=null; if(im2){ const t2=new THREE.Texture(im2); t2.anisotropy=ANISO; t2.needsUpdate=true; matRosto=new THREE.MeshBasicMaterial({map:t2,alphaTest:.5,side:THREE.DoubleSide}); }
      (PECAS[p.cat]=PECAS[p.cat]||[]).push(Object.assign({},p,{src:null,srcRosto:null,asp,geo,mat,matRosto}));
    });
  });
}
const pick=(arr,r)=>arr[Math.floor(r()*arr.length)];
function piece(cat,r){ const p=pick(PECAS[cat],r); return {p, m:new THREE.Mesh(p.geo,p.mat)}; }
// árvore seca = tronco + galhos encaixados na espinha do tronco; cada galho tem pivô próprio para balançar
function deadTree(r,H,inward,nb,sway,minF,faces,faceP){
  const g=new THREE.Group(), {p,m}=piece('tronco',r), flip=r()<.5?-1:1;
  m.scale.set(H*flip,H,1); g.add(m); g.userData.H=H; g.userData.w0=p.espinha[0][2]/p.h*H;
  const sp=p.espinha.filter(s=>s[0]>=(minF||.42));
  for(let i=0;i<nb;i++){
    const s=pick(sp,r), {p:b,m:bm}=piece('galho',r);
    const dir= inward && r()<.8 ? inward : (r()<.5?-1:1);
    const tw=s[2]/p.h*H; let L=H*(.32+r()*.4);
    const thick=b.grossura/b.h*(L/b.asp); if(thick>tw*.9) L*=tw*.9/thick; // base do galho cabe no tronco
    const sb=L/b.asp, pv=new THREE.Group();
    pv.position.set((s[1]-p.px)/p.h*H*flip, s[0]*H, -.03-i*.005); // atrás do tronco: o tronco cobre a emenda
    bm.scale.set(sb*dir,sb,1); pv.add(bm);
    const base=dir*(-.35+r()*.85); pv.rotation.z=base; g.add(pv);
    sway.push({o:pv,b:base,a:.03+r()*.05,ph:r()*6.28,f:.8+r()*.7});
  }
  // tronco sem rosto; no clarão do relâmpago ele troca para o desenho com o rosto
  if(faces && p.matRosto){ m.userData.faceMat=p.matRosto; m.userData.cleanMat=p.mat; m.userData.front=inward!==0; faces.push(m); }
  return g;
}
function pineTree(r,H){ const g=new THREE.Group(), {m}=piece('pinheiro',r); m.scale.set(H*(r()<.5?-1:1),H,1); m.position.y=-.08; g.add(m); return g; }
function groundPiece(r,cat,H){ const {m}=piece(cat,r); m.scale.set(H*(r()<.5?-1:1),H,1); m.position.y=-.03; return m; }
// olhos
function drawEyes(c,jr,a){
  const W=1024,H=400; c.clearRect(0,0,W,H); prep(c);
  [282,742].forEach((cx,k)=>{
    const cy=205, w=205, h=112, top=[], bot=[];
    for(let i=0;i<=14;i++){ const u=i/14; top.push([cx-w+2*w*u, cy-Math.pow(Math.sin(u*Math.PI),.8)*h]); bot.push([cx+w-2*w*u, cy+Math.pow(Math.sin(u*Math.PI),.9)*h*.72]); }
    const al=J(top.concat(bot),a,jr);
    shape(c,al,true,'#fbfaf3',14);
    c.save(); smoothPath(c,al,true); c.clip();
    for(let v=0;v<5;v++){ const s=v<3?-1:1, x0=cx+s*w*.95, y0=cy+(v%3-1)*20; line(c,J([[x0,y0],[x0-s*45,y0+(jr()-.5)*30],[x0-s*85,y0+(jr()-.5)*40]],a*.6,jr),3); }
    c.beginPath(); c.arc(cx+(k?-14:14), cy+6, 74, 0, Math.PI*2); c.fillStyle=INK; c.fill();
    c.beginPath(); c.arc(cx+(k?-14:14)-24, cy-18, 13, 0, Math.PI*2); c.fillStyle='#fbfaf3'; c.fill();
    c.restore();
    shape(c,al,true,null,14);
  });
}
// flor
function drawFlower(c,jr,a){
  c.clearRect(0,0,256,256); prep(c);
  line(c,J([[128,256],[124,190],[130,120]],a,jr),8);
  shape(c,J([[126,200],[90,178],[80,196],[122,212]],a,jr),true,PAPER,6);
  for(let i=0;i<5;i++){ const t=i/5*Math.PI*2-Math.PI/2; shape(c,J(ellipsePts(130+Math.cos(t)*34,96+Math.sin(t)*34,26,20,9),a,jr),true,RED,6); }
  c.beginPath(); c.arc(130,96,15,0,Math.PI*2); c.fillStyle=INK; c.fill();
}
// casa da vovó
function drawHouse(c,jr,a){
  const W=1024,H=768; c.clearRect(0,0,W,H); prep(c);
  shape(c,J([[0,H+10],[0,700],[200,680],[500,690],[800,676],[W,696],[W,H+10]],a,jr),true,PAPER,LW);
  shape(c,J([[652,170],[712,170],[712,330],[652,330]],a,jr),true,PAPER,LW,true);
  shape(c,J([[270,410],[760,410],[760,720],[270,720]],a,jr),true,PAPER,LW,true);
  shape(c,J([[210,430],[515,150],[820,430]],a,jr),true,PAPER,LW,true);
  for(let i=0;i<9;i++){ const x=300+i*48; line(c,J([[x,410],[x+70,330]],a,jr),4); }
  shape(c,J([[320,470],[430,470],[430,570],[320,570]],a,jr),true,INK,LW,true);
  shape(c,J([[600,470],[710,470],[710,570],[600,570]],a,jr),true,INK,LW,true);
  shape(c,J([[465,560],[565,560],[565,720],[465,720]],a,jr),true,PAPER,LW,true);
  c.beginPath(); c.arc(548,648,8,0,Math.PI*2); c.fillStyle=INK; c.fill();
  line(c,J([[375,470],[375,570]],a,jr),5); line(c,J([[655,470],[655,570]],a,jr),5);
}
// Chapeuzinho de costas

function pathX(z){ const d=-z-6; if(d<=0) return 0; const u=Math.min(1,d/24), e=u*u*(3-2*u);
  return e*(3.4*Math.sin(d/12.5)+1.3*Math.sin(d/5.6)); }

function frameAt(z,o){ o=o||{}; const d=(pathX(z+.05)-pathX(z-.05))/.1; o.x=pathX(z); o.a=Math.atan(d); o.c=Math.cos(o.a); o.s=Math.sin(o.a); return o; }

  for(let i=0;i<n;i++){ const m=blood[bloodI++%blood.length], z=pz-1-Math.random()*5, lat=(Math.random()-.5)*2.2; frameAt(z,f);
    m.position.set(f.x+lat*f.c,.02+(bloodI%10)*.001,z-lat*f.s); m.rotation.y=Math.random()*6.28; m.scale.setScalar(.7+Math.random()*.7); m.visible=false; BLOODSET.push(m); }

// cada relâmpago acorda rostos em 3 a 5 árvores à vista (sempre outras)
function setFace(m,on){ if(m.userData.faceMat) m.material=on?m.userData.faceMat:m.userData.cleanMat; else m.visible=on; }
function pickFaces(){
  FACESET.forEach(m=>setFace(m,false)); FACESET=[]; const v=new THREE.Vector3(), c=[];
  rows.forEach(rw=>rw.faces.forEach(m=>{ v.set(0,.5,0); m.localToWorld(v); const d=v.distanceTo(cam.position); if(d<2.5||d>18) return; // meio do tronco
    v.project(cam); if(v.z<1 && Math.abs(v.x)<.92 && Math.abs(v.y)<.8) c.push({m,d,f:m.userData.front,sx:v.x}); }));

  for(let n=2+Math.floor(Math.random()*2); n>0 && fr.length; n--) FACESET.push(fr.splice(Math.floor(Math.random()*Math.min(3,fr.length)),1)[0].m);
  for(let n=1+Math.floor(Math.random()*2); n>0 && bk.length; n--) FACESET.push(bk.splice(Math.floor(Math.random()*bk.length),1)[0].m);

  const fz=clamp(-pz/TOTAL,0,1), far=[];
  rows.forEach(rw=>rw.faces.forEach(m=>{ if(FACESET.includes(m)) return; v.set(0,.5,0); m.localToWorld(v); const d=v.distanceTo(cam.position); if(d<7||d>28) return;
    v.project(cam); if(v.z<1 && Math.abs(v.x)<.95 && Math.abs(v.y)<1) far.push({m,d}); }));

  const nH=Math.random()<.55+.45*fz ? 1+Math.floor(fz*5.5) : 0;
  for(let i=0;i<nH && far.length;i++){
    const o=far.splice(Math.floor(Math.random()*far.length),1)[0], tg=o.m.parent, h=hanged[i], H=tg.userData.H||5;
    const side=Math.sign(tg.position.x)||1;
    if(o.m.userData.front) h.position.set(-side*(.75+Math.random()*.3), 2.6+Math.random()*.5, .04); // pende para o lado da trilha

function lightning(){
  pickFaces();
  // como um relâmpago real/filmado: pré-golpe curto, pausa, golpe principal que acende seco e sai desbotando.
  // Só 2 clarões em menos de 1 s (limite de fotossensibilidade: até 3 por segundo).
  // 1 ou 2 piscadas curtas, depois fica aceso ~meio segundo e desbota. No máximo 3 clarões no segundo (limite de fotossensibilidade).
  const seg=[], np=REDUCE?0:(Math.random()<.5?1:2);
  for(let i=0;i<np;i++) seg.push([1,.045+Math.random()*.03],[0,.07+Math.random()*.05]);
  const fz=clamp(-pz/TOTAL,0,1); // quanto mais longe na floresta, mais o clarão demora a apagar

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;

  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
function update(dt){

    if(caughtT>1.3 && !dying) over();

    else { c.t+=dt;

    } else if(state==='caught'){ wShow=1; }
    const sm=(a,b,x)=>{ const u=clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
    const wd=state==='caught'?lerp(2.6,.9,Math.min(1,caughtT/1.1)):3+67*Math.pow(1-wShow,1.5);
    const lu=0;
    const S=8.5*(1+.018*Math.sin(t*2.3)+.04*lu), sway=Math.sin(t*.5)*.6*(1-wShow*.6), el=eyeSide*wd+sway*0;
    const ey=(state==='caught'?1.6:2.5+.5*wShow*wShow+Math.sin(t*2.3)*.05-.35*lu)-(LOBO.ey-.5)*S; // perto, a cabeça sobe acima da copa
    const U=wolfMat.uniforms; U.uOp.value=op; U.uR2.value=state==='caught'?1:sm(.38,.62,wShow); U.uR3.value=state==='caught'?1:sm(.72,.97,wShow);

  scene.fog.color.copy(pc);
  if(sky){ sky.position.set(wx,42,wz); sky.rotation.y=heading; sky.material.opacity=1-(state==='caught'?1:lookAmt*lookAmt*(3-2*lookAmt)); }
  // vazio: o fundo vai do papel ao preto conforme ela vira a cabeça (sem borda dura); no clarão, inverte

}
// braços se arrastando: estica à frente, crava a mão e puxa (a mão fica no chão enquanto o corpo avança); os dois alternam
const SH_X=.19, SH_Y=-.18; // ombros (coordenadas da folha da Chapeuzinho: .95 x 1.3, centro no meio)
function armsTick(on){
  for(const m of arms){ m.visible=on; if(!on) continue;
    const {E,P,side}=m.userData, u=(((gaitT/6.2832)+(side>0?0:.5))%1+1)%1;
    let pose=E, dy, rot;
    if(u<.22){ const e=u/.22; dy=lerp(-.05,.06,e*e*(3-2*e)); rot=lerp(.2,.45,e); }          // estica para frente (rápido)
    else if(u<.5){ const e=(u-.22)/.28; dy=lerp(.06,-.04,e); rot=lerp(.45,.36,e); }          // mão cravada: o corpo passa por ela
    else { const e=(u-.5)/.5; pose=P; dy=lerp(.05,-.06,e); rot=lerp(.25,0,e); }             // braço dobrado puxando (sempre um estica enquanto o outro puxa)
    if(m.geometry!==pose.geo){ m.geometry=pose.geo; m.material=pose.mat; }
    // a arte do braço esticado é uma mão ESQUERDA e a do dobrado uma DIREITA: espelha só no lado oposto
    // (esticado: espelhar inverte a inclinação de ~.49 rad, por isso gira .98 a mais para manter a direção)
    if(pose===E){ m.scale.x=-side; m.rotation.z=-side*(.98-rot); } else { m.scale.x=side; m.rotation.z=side*rot; }

}
function showEnd(){ $('pbtn').classList.add('hide'); stickEnd();

  $('endstats').textContent=`Flores colhidas: ${got} de ${flowers.length} · capa: ${['','um farrapo','rasgada','inteira'][hp]}`;
  const ps=[...document.querySelectorAll('#endtxt p')]; ps.forEach((p,i)=>setTimeout(()=>p.classList.add('on'),400+i*1500));
  musicOn=false;
}

// ---------- início ----------
setTimeout(()=>{
  buildArt(); drawRed(0,3,1,2.2);
  loadPecas().then(()=>{
    buildWorld();
    scene.traverse(o=>{ if(o.material && !o.material.isShaderMaterial) patchInvert(o.material); });
    Object.values(PECAS).forEach(l=>l.forEach(p=>{ patchInvert(p.mat); if(p.matRosto) patchInvert(p.matRosto); })); patchInvert(hangMat);
